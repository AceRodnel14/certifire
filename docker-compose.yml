# Self-hosting: docker compose pull && docker compose up -d
# Development:  docker compose up --build
services:
  app:
    image: ${IMAGE:-eacer/certifire:latest}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-certifire}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-certifire}?sslmode=disable
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    depends_on:
      - db
    # The image's HEALTHCHECK already runs (`/app healthcheck` -> /healthz).
    # Uncomment to change its timings, or use `disable: true` to turn it off.
    # healthcheck:
    #   test: ["CMD", "/app", "healthcheck"]
    #   interval: 30s
    #   timeout: 3s
    #   start_period: 5s
    #   retries: 3

  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-certifire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-certifire}
    volumes:
      - pg-data:/var/lib/postgresql
    # No healthcheck: the app retries its database connection until Postgres is up.
    # healthcheck:
    #   test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-certifire}"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 5

volumes:
  pg-data:
